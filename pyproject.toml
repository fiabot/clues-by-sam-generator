
 [build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cluesBySamGeneration"
readme = "README.md"
version = "0.1.0"
description = "Tools for generating clues by sam puzzles"
authors = [
{ name = "Fiona Shyne", email = "shyne.f@northeastern.edu" }
]
requires-python = ">=3.8,<4.0"
license = { file = "LICENSE" }
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Operating System :: OS Independent"
]
dependencies = ["z3-solver (>=4.15.4.0,<5.0.0.0)", "pydantic (>=2.13.5)"]